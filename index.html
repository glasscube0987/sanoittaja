<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Kaksi palkin väriä laitteen tilan mukaan; käyttäjän valinta korvaa
         molemmat (lib/theme.ts). Samat kuin tyylitiedoston --bg. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1b2b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f5f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- PNG eikä SVG: iOS ei käytä SVG:tä kotiruutukuvakkeena, ja ilman tätä
         kotiruudulle päätyy kuvakaappaus sivusta. Tehdään: scripts/kuvakkeet.mjs -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Sanoittaja</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

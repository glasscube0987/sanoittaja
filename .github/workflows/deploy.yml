name: Test and deploy

# Testit ajetaan myös kehityshaaroissa, julkaisu vain mainista. Aiemmin ajo
# käynnistyi vain mainissa, joten WebKit-kate – jota ei voi ajaa paikallisesti –
# saatiin vasta samalla hetkellä kun muutos jo julkaistiin oikeaan sovellukseen.
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Haarakohtainen ryhmä: yhteisessä ryhmässä kehityshaaran push peruisi kesken
# olevan julkaisun.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Ajokuva oli hetken kiinnitetty 24.04:ään, koska Playwright 1.56 ei
    # tuntenut 26.04:ää ja julkaisu pysähtyi siihen. Kiinnitys poistui kun
    # Playwright päivitettiin; jos «Install browsers» kaatuu taas viestiin
    # «does not support … on ubuntuXX», syy on sama ja lääke on sama.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser tests
        run: npm run test:e2e

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
